name: Build patched APK

# Manually builds the full patched Instagram APK (FeurStagram + hashtag filter).
# Run from the Actions tab -> "Build patched APK" -> "Run workflow".
# Defaults just work: downloads the latest Instagram APK from APKPure and
# builds a side-by-side clone (com.instagram.android.feurstagram) so it
# installs next to your real Instagram.
#
# The APK is signed with Morphe's throwaway test key: if a previous test build
# refuses to install as an update, uninstall it first, then install fresh.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to the Instagram APK file (upload it to catbox.moe from your phone, paste the files.catbox.moe link here)'
        required: true
        type: string
      clone:
        description: 'Side-by-side install (com.instagram.android.feurstagram)'
        required: false
        default: true
        type: boolean

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build patch bundle
        run: |
          chmod +x gradlew
          ./gradlew :patches:build --no-daemon

      - name: Download Morphe CLI
        run: |
          mkdir -p tools build
          URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print([a['browser_download_url'] for a in r['assets'] if a['name'].endswith('-all.jar')][0])")
          echo "CLI: $URL"
          curl -sL -o tools/morphe-desktop-all.jar "$URL"
          java -jar tools/morphe-desktop-all.jar --version

      - name: Download Instagram APK
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          URL="${{ inputs.apk_url }}"
          EXT="${URL##*.}"; EXT="${EXT%%\?*}"; EXT="$(echo "$EXT" | tr '[:upper:]' '[:lower:]')"
          case "$EXT" in apk|xapk|apkm|apks) ;; *) EXT="apk" ;; esac
          echo "Downloading as instagram.$EXT"
          curl -sL -A "$UA" -o "instagram.$EXT" "$URL"
          ls -la "instagram.$EXT"
          file "instagram.$EXT" | head -1
          file "instagram.$EXT" | grep -qi "zip archive" || { echo "APK download failed (not a zip/APK):"; head -c 300 "instagram.$EXT"; echo; exit 1; }
          echo "APK_FILE=instagram.$EXT" >> "$GITHUB_ENV"

      - name: Patch APK
        run: |
          MPP=$(ls -t patches/build/libs/patches-*[0-9].mpp | grep -v -- '-sources\|-javadoc' | head -1)
          echo "Bundle: $MPP"
          ARGS=()
          if [ "${{ inputs.clone }}" = "true" ]; then ARGS+=(-e "Clone"); fi
          java -jar tools/morphe-desktop-all.jar patch \
            -p "$MPP" \
            --force \
            --continue-on-error \
            -r build/patch-report.json \
            -o feurstagram.apk \
            "${ARGS[@]}" \
            "$APK_FILE"

      - name: Patch report
        if: always()
        run: |
          python3 - build/patch-report.json <<'EOF' || true
          import json, sys
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      walk(v, f"{path}.{k}" if path else k)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:60]):
                      walk(v, f"{path}[{i}]")
              else:
                  s = str(o)
                  print(f"{path} = {s[:200]}")
          try:
              walk(json.load(open(sys.argv[1])))
          except Exception as e:
              print(f"no readable report: {e}")
          EOF

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: feurstagram-apk
          path: feurstagram.apk
          if-no-files-found: error

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report
          path: build/patch-report.json
