name: Build patch bundle

# Compile-checks the patches (including the hashtag filter) and uploads the
# .mpp bundle. This is the fastest way to verify the Kotlin/Java code builds.

on:
  push:
    branches: [main, master]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - '.github/workflows/patch-build.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build patch bundle
        run: |
          chmod +x gradlew
          ./gradlew :patches:build --no-daemon

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*[0-9].mpp
          if-no-files-found: error
